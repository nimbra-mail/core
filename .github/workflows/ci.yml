name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint and test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  ios:
    name: iOS targets and XCFramework
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios
      - name: Build the XCFramework and the Swift bindings
        run: ./scripts/build-ios-core.sh
      - name: The committed Swift bindings are current
        run: git diff --exit-code -- Sources/NimbraCore
      - name: The Swift package builds for iOS
        run: |
          set -o pipefail
          xcodebuild -scheme NimbraCore -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
